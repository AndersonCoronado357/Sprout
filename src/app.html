<!doctype html>
<html lang="es" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>
		<script>
			// Marca si es móvil ANTES de pintar, para no mostrar el sidebar de
			// escritorio un instante en celular. Va DESPUÉS del meta viewport para
			// que matchMedia evalúe contra el ancho real del dispositivo.
			try {
				document.documentElement.dataset.mob = window.matchMedia('(max-width: 859px)').matches
					? '1'
					: '0';
			} catch (e) {}
		</script>
		<style>
			html[data-mob='1'] aside[data-sidebar] {
				display: none !important;
			}
		</style>
		<meta name="theme-color" content="#0D0E0F" />
		<meta
			name="description"
			content="Sprout — mira crecer tus ahorros, una meta a la vez."
		/>

		<!-- Favicon + PWA -->
		<link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png?v=2" />
		<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png?v=2" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Sprout" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
